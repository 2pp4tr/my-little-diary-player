<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MY LITTLE DIARY MUSIC PLAYER</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #fffaf7 !important;
  background-color: #fffaf7 !important;
}

body {
  padding: 16px;

  font-family:
    'Apple SD Gothic Neo',
    'Malgun Gothic',
    sans-serif;

  color: #4f6652;
}


/* 🎀 메인 카드 */

.player {
  width: 100%;
  max-width: 620px;

  margin: auto;

  padding: 16px;

  background: #fffaf7;

  border: 2px solid #e5f2df;

  border-radius: 28px;

  box-shadow:
    0 8px 24px rgba(180,150,140,.10);
}


/* 🎵 제목 영역 */

.header {
  display: flex;

  align-items: center;

  gap: 12px;

  margin-bottom: 13px;
}


/* 🎵 아이콘 */

.music-icon {
  width: 48px;
  height: 48px;

  flex: 0 0 48px;

  display: flex;

  align-items: center;
  justify-content: center;

  background: #e5f2df;

  border-radius: 17px;

  font-size: 22px;
}


/* 제목 */

.title-box {
  min-width: 0;

  flex: 1;
}

.title {
  font-size: 16px;

  color: #4f6652;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.subtitle {
  margin-top: 3px;

  font-size: 11px;

  color: #91a292;
}


/* 🎬 YouTube 영역 */

.video-wrap {
  width: 100%;

  overflow: hidden;

  border-radius: 21px;

  background: #e5f2df;
}


/* 실제 YouTube 플레이어 */

.video-wrap iframe {
  display: block;

  width: 100%;

  aspect-ratio: 16 / 9;

  border: 0;
}


/* 🔗 링크 입력 */

.urlbox {
  display: flex;

  gap: 7px;

  margin-top: 12px;
}

.urlbox input {
  min-width: 0;

  flex: 1;

  padding: 10px 12px;

  border: 1px solid #dfe9da;

  border-radius: 14px;

  background: #fff;

  color: #4f6652;

  font-family: inherit;

  font-size: 12px;

  outline: none;
}

.urlbox input:focus {
  border-color: #b8cdb2;
}


/* 불러오기 버튼 */

.urlbox button {
  border: 0;

  padding: 0 14px;

  height: 38px;

  border-radius: 13px;

  background: #e5f2df;

  color: #4f6652;

  font-family: inherit;

  font-size: 12px;

  cursor: pointer;
}

.urlbox button:active {
  transform: scale(.96);
}


/* 🌷 아래 문구 */

.note {
  margin-top: 9px;

  text-align: center;

  font-size: 10px;

  color: #a0aaa0;
}
</style>
</head>


<body>

<div class="player">


  <!-- 🎀 제목 -->

  <div class="header">

    <div class="music-icon">
      🎵
    </div>

    <div class="title-box">

      <div class="title">
        ♡ 오늘의 플레이리스트 ♡
      </div>

      <div class="subtitle">
        오늘도 좋은 노래와 함께
      </div>

    </div>

  </div>


  <!-- 🎬 실제 YouTube 플레이어 -->

  <div class="video-wrap">

    <iframe
      id="youtube"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?controls=1&rel=0&playsinline=1"
      title="YouTube Music Player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>

  </div>


  <!-- 🔗 YouTube 링크 -->

  <div class="urlbox">

    <input
      id="url"
      type="text"
      placeholder="YouTube 링크를 붙여넣어 주세요"
    >

    <button
      id="load"
      type="button">
      불러오기
    </button>

  </div>


  <div class="note">
    ♡ YouTube에서 ▶ 버튼을 눌러 재생해 주세요 ♡
  </div>

</div>


<script>

/* 🎬 YouTube 링크에서 영상 ID 찾기 */

function getVideoId(url) {

  try {

    const u = new URL(url);


    /* youtu.be/xxxx */

    if (
      u.hostname.includes('youtu.be')
    ) {

      return u.pathname
        .replace('/', '')
        .split('?')[0];

    }


    /* youtube.com/watch?v=xxxx */

    const v =
      u.searchParams.get('v');


    if (v) {

      return v;

    }


    /* /shorts/xxxx */

    /* /embed/xxxx */

    const match =
      u.pathname.match(
        /\/(?:shorts|embed)\/([^/?]+)/
      );


    return match
      ? match[1]
      : '';

  }

  catch (e) {

    return '';

  }

}


/* 🎵 불러오기 */

document
  .getElementById('load')
  .addEventListener('click', function() {

    const url =
      document
        .getElementById('url')
        .value
        .trim();


    const id =
      getVideoId(url);


    if (!id) {

      alert(
        'YouTube 링크를 확인해 주세요.'
      );

      return;

    }


    /*
    YouTube 자체 플레이어를
    새로운 영상으로 변경

    여기서는 YouTube API를 사용하지 않음.
    */

    const iframe =
      document.getElementById('youtube');


    iframe.src =
      'https://www.youtube.com/embed/' +
      id +
      '?controls=1&rel=0&playsinline=1';

  });


/* ⌨️ 엔터로도 불러오기 */

document
  .getElementById('url')
  .addEventListener('keydown', function(e) {

    if (e.key === 'Enter') {

      document
        .getElementById('load')
        .click();

    }

  });

</script>

</body>
</html>
