<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY LITTLE DIARY PLAYER</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #fffaf7;
}

body {
  padding: 20px;
  font-family:
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;
}

.player {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;

  padding: 18px;

  background: #fffaf7;

  border: 3px solid #b8d6ad;

  border-radius: 30px;

  box-shadow:
    0 10px 30px rgba(100, 130, 100, 0.15);
}

/* 제목 */

.header {
  display: flex;
  align-items: center;
  gap: 13px;

  margin-bottom: 15px;
}

.icon {
  width: 52px;
  height: 52px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 18px;

  background: #dcebd6;

  font-size: 25px;
}

.title {
  color: #4f6652;
  font-size: 17px;
  font-weight: 600;
}

.artist {
  margin-top: 3px;

  color: #91a292;
  font-size: 11px;
}


/* ⭐ 여기서부터 실제 YouTube 플레이어 */

.youtube-box {
  width: 100%;

  background: #dcebd6;

  border-radius: 23px;

  overflow: hidden;
}

.youtube-box iframe {
  display: block;

  width: 100%;

  aspect-ratio: 16 / 9;

  border: 0;
}


/* 링크 */

.url {
  display: flex;
  gap: 8px;

  margin-top: 13px;
}

.url input {
  flex: 1;
  min-width: 0;

  height: 40px;

  padding: 0 13px;

  border: 1px solid #d8e5d3;

  border-radius: 14px;

  background: white;

  outline: none;

  font-size: 12px;

  color: #4f6652;
}

.url button {
  height: 40px;

  padding: 0 15px;

  border: 0;

  border-radius: 14px;

  background: #dcebd6;

  color: #4f6652;

  font-size: 12px;

  cursor: pointer;
}


/* 설명 */

.message {
  margin-top: 9px;

  text-align: center;

  color: #9da89d;

  font-size: 10px;
}
</style>

</head>

<body>

<div class="player">

  <div class="header">

    <div class="icon">
      🎵
    </div>

    <div>
      <div class="title">
        ♡ 오늘의 플레이리스트 ♡
      </div>

      <div class="artist">
        MY LITTLE DIARY
      </div>
    </div>

  </div>


  <!-- 실제 YouTube 플레이어 -->

  <div class="youtube-box">

    <iframe
      id="youtube"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?controls=1&rel=0&playsinline=1"
      title="YouTube player"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>

  </div>


  <!-- YouTube 링크 -->

  <div class="url">

    <input
      id="urlInput"
      type="text"
      placeholder="YouTube 링크를 붙여넣어 주세요"
    >

    <button id="loadButton">
      불러오기
    </button>

  </div>


  <div class="message">
    ♡ YouTube 플레이어에서 ▶ 버튼을 눌러주세요 ♡
  </div>

</div>


<script>

function getYouTubeId(url) {

  try {

    const parsed = new URL(url);

    if (
      parsed.hostname === "youtu.be"
    ) {
      return parsed.pathname
        .replace("/", "")
        .split("?")[0];
    }

    const videoId =
      parsed.searchParams.get("v");

    if (videoId) {
      return videoId;
    }

    const match =
      parsed.pathname.match(
        /\/(?:embed|shorts)\/([^/?]+)/
      );

    if (match) {
      return match[1];
    }

  } catch (error) {}

  return null;
}


document
  .getElementById("loadButton")
  .addEventListener("click", function () {

    const input =
      document.getElementById("urlInput");

    const id =
      getYouTubeId(input.value.trim());

    if (!id) {

      alert("YouTube 링크를 확인해 주세요.");

      return;
    }

    document
      .getElementById("youtube")
      .src =
        "https://www.youtube.com/embed/" +
        id +
        "?controls=1&rel=0&playsinline=1";

  });


document
  .getElementById("urlInput")
  .addEventListener("keydown", function (event) {

    if (event.key === "Enter") {

      document
        .getElementById("loadButton")
        .click();

    }

  });

</script>

</body>
</html>
