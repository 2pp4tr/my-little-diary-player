<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY LITTLE DIARY MUSIC PLAYER</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #fffaf7 !important;
}

body {
    padding: 12px;
    font-family:
        'Apple SD Gothic Neo',
        'Malgun Gothic',
        sans-serif;
    color: #4f6652;
}


/* ╭─────────────────────╮
   🎀 PLAYER
╰─────────────────────╯ */

.player {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;

    padding: 14px 15px;

    background: #fffaf7;

    border: 2px solid #e5f2df;
    border-radius: 27px;

    box-shadow:
        0 8px 24px rgba(180, 150, 140, 0.10);
}


/* ╭─────────────────────╮
   🎵 TOP
╰─────────────────────╯ */

.top {
    display: flex;
    align-items: center;
    gap: 11px;

    margin-bottom: 8px;
}


/* 앨범 아이콘 */

.cover {
    width: 48px;
    height: 48px;

    flex: 0 0 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #e5f2df;

    border-radius: 17px;

    font-size: 21px;
}


/* 제목 */

.info {
    min-width: 0;
    flex: 1;
}

.title {
    color: #4f6652;

    font-size: 15px;
    font-weight: 500;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.artist {
    margin-top: 2px;

    color: #91a292;

    font-size: 10px;
}


/* 재생 버튼 */

.play-button {
    width: 40px;
    height: 40px;

    flex: 0 0 40px;

    border: 0;
    border-radius: 50%;

    background: #e5f2df;
    color: #4f6652;

    font-size: 16px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

.play-button:hover {
    background: #dcebd6;
    transform: scale(1.05);
}

.play-button:active {
    transform: scale(0.95);
}


/* ╭─────────────────────╮
   👻 YOUTUBE 숨김 영역
╰─────────────────────╯ */

/*
  YouTube iframe은 실제 재생을 위해
  DOM 안에 그대로 유지한다.

  단, 영상이 보이지 않도록
  같은 크기의 크림색 덮개를 위에 올린다.
*/

.youtube-area {
    position: relative;

    width: 80px;
    height: 45px;

    margin: 2px auto 0;

    overflow: hidden;

    background: #fffaf7;

    border-radius: 10px;
}


/* 실제 YouTube */

#youtube {
    display: block !important;

    width: 80px !important;
    height: 45px !important;

    min-width: 80px !important;
    max-width: 80px !important;

    min-height: 45px !important;
    max-height: 45px !important;

    border: 0 !important;

    border-radius: 10px !important;
}


/*
  👻 영상 가리개

  영상과 완전히 같은 크기의
  크림색 레이어를 위에 올린다.
*/

.youtube-cover {
    position: absolute;

    inset: 0;

    z-index: 10;

    background: #fffaf7;

    border-radius: 10px;

    pointer-events: none;
}


/* ╭─────────────────────╮
   📍 PROGRESS
╰─────────────────────╯ */

.progress-area {
    display: flex;
    align-items: center;

    gap: 7px;

    margin-top: 7px;
}


/* 시간 */

.time {
    width: 31px;

    flex: 0 0 31px;

    color: #91a292;

    font-size: 9px;

    text-align: center;
}


/* 진행바 */

#progress {
    flex: 1;

    width: 100%;
    height: 5px;

    margin: 0;

    appearance: none;
    -webkit-appearance: none;

    background: #dfe9da;

    border-radius: 10px;

    outline: none;

    cursor: pointer;
}


/* Chrome / Safari */

#progress::-webkit-slider-runnable-track {
    height: 5px;

    background: #dfe9da;

    border-radius: 10px;
}

#progress::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 11px;
    height: 11px;

    margin-top: -3px;

    border: 0;

    border-radius: 50%;

    background: #91ad91;

    cursor: pointer;
}


/* Firefox */

#progress::-moz-range-track {
    height: 5px;

    background: #dfe9da;

    border-radius: 10px;
}

#progress::-moz-range-thumb {
    width: 11px;
    height: 11px;

    border: 0;

    border-radius: 50%;

    background: #91ad91;

    cursor: pointer;
}


/* ╭─────────────────────╮
   🔗 URL
╰─────────────────────╯ */

.urlbox {
    display: flex;

    gap: 7px;

    margin-top: 9px;
}

.urlbox input {
    min-width: 0;

    flex: 1;

    height: 34px;

    padding: 0 11px;

    border: 1px solid #dfe9da;

    border-radius: 13px;

    outline: none;

    background: #fff;

    color: #4f6652;

    font-family: inherit;

    font-size: 10px;
}

.urlbox input::placeholder {
    color: #aab3aa;
}

.urlbox input:focus {
    border-color: #b8cdb2;
}


/* 불러오기 */

.load-button {
    height: 34px;

    padding: 0 12px;

    border: 0;

    border-radius: 12px;

    background: #e5f2df;

    color: #4f6652;

    font-family: inherit;

    font-size: 11px;

    cursor: pointer;

    white-space: nowrap;
}

.load-button:hover {
    background: #dcebd6;
}


/* 안내문 */

.note {
    margin-top: 7px;

    color: #a0aaa0;

    font-size: 9px;

    text-align: center;
}


/* ╭─────────────────────╮
   📱 MOBILE
╰─────────────────────╯ */

@media (max-width: 450px) {

    body {
        padding: 8px;
    }

    .player {
        padding: 11px;
    }

    .youtube-area {
        width: 80px;
        height: 45px;
    }

    #youtube {
        width: 80px !important;
        height: 45px !important;

        min-width: 80px !important;
        max-width: 80px !important;

        min-height: 45px !important;
        max-height: 45px !important;
    }
}
</style>
</head>


<body>

<div class="player">

    <!-- 🎵 위쪽 -->

    <div class="top">

        <div class="cover">
            🎵
        </div>

        <div class="info">

            <div class="title" id="title">
                오늘의 노래
            </div>

            <div class="artist" id="artist">
                YouTube Music
            </div>

        </div>


        <button
            class="play-button"
            id="playBtn"
            type="button"
            aria-label="재생"
        >
            ▶
        </button>

    </div>


    <!-- 👻 실제 YouTube + 가리개 -->

    <div class="youtube-area">

        <div id="youtube"></div>

        <div class="youtube-cover"></div>

    </div>


    <!-- 📍 진행바 -->

    <div class="progress-area">

        <span
            class="time"
            id="current"
        >
            0:00
        </span>


        <input
            id="progress"
            type="range"
            min="0"
            max="0"
            value="0"
            step="0.1"
        >


        <span
            class="time"
            id="duration"
        >
            0:00
        </span>

    </div>


    <!-- 🔗 YouTube 링크 -->

    <div class="urlbox">

        <input
            id="url"
            type="text"
            placeholder="YouTube 링크를 붙여넣어 주세요"
        >

        <button
            class="load-button"
            id="load"
            type="button"
        >
            불러오기
        </button>

    </div>


    <div class="note">
        ♡ YouTube 링크를 불러와 음악을 재생해 주세요 ♡
    </div>

</div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>

let player = null;

let playerReady = false;

let progressTimer = null;


/* 요소 */

const titleElement =
    document.getElementById('title');

const artistElement =
    document.getElementById('artist');

const playButton =
    document.getElementById('playBtn');

const progress =
    document.getElementById('progress');

const currentElement =
    document.getElementById('current');

const durationElement =
    document.getElementById('duration');

const urlInput =
    document.getElementById('url');

const loadButton =
    document.getElementById('load');



/* ─────────────────────
   ⏱ 시간 표시
───────────────────── */

function formatTime(seconds) {

    seconds = Math.max(
        0,
        Math.floor(seconds || 0)
    );

    const minutes =
        Math.floor(seconds / 60);

    const remaining =
        String(seconds % 60)
        .padStart(2, '0');

    return minutes + ':' + remaining;
}



/* ─────────────────────
   🔗 YouTube ID 찾기
───────────────────── */

function getVideoId(url) {

    try {

        const parsed =
            new URL(url);


        if (
            parsed.hostname
                .includes('youtu.be')
        ) {

            return parsed.pathname
                .replace('/', '')
                .split('?')[0];

        }


        const v =
            parsed.searchParams.get('v');

        if (v) {
            return v;
        }


        const match =
            parsed.pathname.match(
                /\/(?:shorts|embed)\/([^/?]+)/
            );

        if (match) {
            return match[1];
        }

    }

    catch (error) {

    }

    return null;
}



/* ─────────────────────
   ▶ YouTube API
───────────────────── */

function onYouTubeIframeAPIReady() {

    player =
        new YT.Player(
            'youtube',
            {

                width: '80',

                height: '45',

                videoId: '',


                playerVars: {

                    controls: 1,

                    rel: 0,

                    playsinline: 1

                },


                events: {

                    onReady:
                        function () {

                            playerReady = true;

                        },


                    onStateChange:
                        function (event) {

                            handleState(
                                event.data
                            );

                        }

                }

            }
        );
}



/* ─────────────────────
   🎵 재생 상태
───────────────────── */

function handleState(state) {

    if (
        state ===
        YT.PlayerState.PLAYING
    ) {

        playButton.textContent = 'Ⅱ';

        startProgress();

        updateInfo();

    }

    else if (
        state ===
        YT.PlayerState.PAUSED
    ) {

        playButton.textContent = '▶';

        updateProgress();

        stopProgress();

    }

    else if (
        state ===
        YT.PlayerState.ENDED
    ) {

        playButton.textContent = '▶';

        updateProgress();

        stopProgress();

    }

    else {

        playButton.textContent = '▶';

    }

}



/* ─────────────────────
   🎵 제목 / 채널
───────────────────── */

function updateInfo() {

    if (
        !player ||
        !playerReady
    ) {
        return;
    }


    const data =
        player.getVideoData
            ? player.getVideoData()
            : null;


    if (!data) {
        return;
    }


    if (data.title) {

        titleElement.textContent =
            data.title;

    }


    if (data.author) {

        artistElement.textContent =
            data.author;

    }

}



/* ─────────────────────
   📍 진행바
───────────────────── */

function updateProgress() {

    if (
        !player ||
        !playerReady
    ) {
        return;
    }


    const duration =
        player.getDuration() || 0;


    const current =
        player.getCurrentTime() || 0;


    currentElement.textContent =
        formatTime(current);


    durationElement.textContent =
        formatTime(duration);


    if (duration > 0) {

        progress.max =
            duration;

        progress.value =
            Math.min(
                current,
                duration
            );

    }

}



/* ─────────────────────
   🔄 진행바 반복
───────────────────── */

function startProgress() {

    stopProgress();

    updateProgress();


    progressTimer =
        setInterval(
            function () {

                updateProgress();

            },
            250
        );

}



function stopProgress() {

    if (progressTimer) {

        clearInterval(
            progressTimer
        );

        progressTimer = null;

    }

}



/* ─────────────────────
   ▶ 커스텀 재생 버튼
───────────────────── */

playButton.addEventListener(
    'click',
    function () {

        if (
            !player ||
            !playerReady
        ) {
            return;
        }


        const state =
            player.getPlayerState();


        if (
            state ===
            YT.PlayerState.PLAYING
        ) {

            player.pauseVideo();

        }

        else {

            player.playVideo();

        }

    }
);



/* ─────────────────────
   ⏩ 진행바 이동
───────────────────── */

progress.addEventListener(
    'input',
    function () {

        if (
            !player ||
            !playerReady
        ) {
            return;
        }


        const time =
            Number(this.value);


        player.seekTo(
            time,
            true
        );


        currentElement.textContent =
            formatTime(time);

    }
);



/* ─────────────────────
   🔗 불러오기
───────────────────── */

loadButton.addEventListener(
    'click',
    function () {

        loadVideo();

    }
);



urlInput.addEventListener(
    'keydown',
    function (event) {

        if (
            event.key === 'Enter'
        ) {

            loadVideo();

        }

    }
);



/* ─────────────────────
   🎵 영상 로드
───────────────────── */

function loadVideo() {

    const id =
        getVideoId(
            urlInput.value.trim()
        );


    if (!id) {

        alert(
            'YouTube 링크를 확인해 주세요.'
        );

        return;

    }


    if (
        !player ||
        !playerReady
    ) {

        alert(
            'YouTube 플레이어가 아직 준비되지 않았어요. 잠시 후 다시 눌러주세요.'
        );

        return;

    }


    player.loadVideoById(id);


    titleElement.textContent =
        '불러오는 중...';

    artistElement.textContent =
        'YouTube Music';


    currentElement.textContent =
        '0:00';

    durationElement.textContent =
        '0:00';


    progress.value = 0;

    progress.max = 0;

}



/* ─────────────────────
   🧹 정리
───────────────────── */

window.addEventListener(
    'beforeunload',
    function () {

        stopProgress();

    }
);

</script>

</body>
</html>
