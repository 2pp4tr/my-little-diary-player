<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY LITTLE DIARY MUSIC PLAYER</title>

<style>

/* ═══════════════════════════════════════
   🎀 기본
═══════════════════════════════════════ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #fffaf7 !important;
}

body {
    padding: 14px;

    font-family:
        'Apple SD Gothic Neo',
        'Malgun Gothic',
        sans-serif;

    color: #4f6652;
}


/* ═══════════════════════════════════════
   🎵 메인 플레이어
═══════════════════════════════════════ */

.player {
    width: 100%;
    max-width: 560px;

    margin: 0 auto;

    padding: 13px 15px;

    background: #fffaf7;

    border: 2px solid #e5f2df;

    border-radius: 27px;

    box-shadow:
        0 8px 24px rgba(180, 150, 140, 0.10);
}


/* ═══════════════════════════════════════
   🎀 상단
═══════════════════════════════════════ */

.top {
    display: flex;

    align-items: center;

    gap: 11px;

    margin-bottom: 10px;
}


/* 음악 아이콘 */

.cover {
    width: 50px;
    height: 50px;

    flex: 0 0 50px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #e5f2df;

    border-radius: 17px;

    font-size: 22px;
}


/* 제목 */

.info {
    min-width: 0;

    flex: 1;
}

.title {
    color: #4f6652;

    font-size: 15px;

    font-weight: 500;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.artist {
    margin-top: 2px;

    color: #91a292;

    font-size: 10px;
}


/* ═══════════════════════════════════════
   ▶ 큰 재생 버튼
═══════════════════════════════════════ */

.play-button {
    width: 40px;
    height: 40px;

    flex: 0 0 40px;

    border: 0;

    border-radius: 50%;

    background: #e5f2df;

    color: #4f6652;

    font-size: 16px;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

.play-button:hover {
    background: #dcebd6;

    transform: scale(1.05);
}

.play-button:active {
    transform: scale(0.95);
}


/* ═══════════════════════════════════════
   🎬 실제 YouTube 플레이어
═══════════════════════════════════════ */

.youtube-area {
    width: 100%;

    min-height: 96px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 5px;

    background: #e5f2df;

    border-radius: 19px;

    overflow: hidden;
}


/*
   너무 크지 않게 작은 영상으로 표시
*/

#youtube {
    display: block;

    width: 160px !important;
    height: 90px !important;

    min-width: 160px !important;
    max-width: 160px !important;

    min-height: 90px !important;
    max-height: 90px !important;

    border: 0;

    border-radius: 14px;

    background: #e5f2df;
}


/* ═══════════════════════════════════════
   🎧 진행바
═══════════════════════════════════════ */

.progress-area {
    display: flex;

    align-items: center;

    gap: 7px;

    margin-top: 9px;
}

.time {
    width: 30px;

    flex: 0 0 30px;

    color: #91a292;

    font-size: 9px;

    text-align: center;
}


/* 진행바 */

#progress {
    flex: 1;

    width: 100%;

    height: 4px;

    margin: 0;

    appearance: none;

    -webkit-appearance: none;

    background: #dfe9da;

    border-radius: 10px;

    outline: none;

    cursor: pointer;
}


/* Chrome / Safari */

#progress::-webkit-slider-runnable-track {
    height: 4px;

    background: #dfe9da;

    border-radius: 10px;
}

#progress::-webkit-slider-thumb {
    appearance: none;

    -webkit-appearance: none;

    width: 11px;
    height: 11px;

    margin-top: -3.5px;

    border: 0;

    border-radius: 50%;

    background: #91ad91;

    cursor: pointer;
}


/* ═══════════════════════════════════════
   🔗 YouTube 링크
═══════════════════════════════════════ */

.urlbox {
    display: flex;

    gap: 7px;

    margin-top: 10px;
}

.urlbox input {
    min-width: 0;

    flex: 1;

    height: 34px;

    padding: 0 11px;

    border: 1px solid #dfe9da;

    border-radius: 13px;

    outline: none;

    background: #ffffff;

    color: #4f6652;

    font-family: inherit;

    font-size: 10px;
}

.urlbox input::placeholder {
    color: #aab3aa;
}

.urlbox input:focus {
    border-color: #b8cdb2;
}


.load-button {
    height: 34px;

    padding: 0 12px;

    border: 0;

    border-radius: 12px;

    background: #e5f2df;

    color: #4f6652;

    font-family: inherit;

    font-size: 11px;

    cursor: pointer;

    white-space: nowrap;
}

.load-button:hover {
    background: #dcebd6;
}


/* ═══════════════════════════════════════
   🌷 안내
═══════════════════════════════════════ */

.note {
    margin-top: 7px;

    color: #a0aaa0;

    font-size: 9px;

    text-align: center;
}


/* ═══════════════════════════════════════
   📱 작은 화면
═══════════════════════════════════════ */

@media (max-width: 450px) {

    body {
        padding: 9px;
    }

    .player {
        padding: 11px;
    }

    #youtube {
        width: 145px !important;
        height: 82px !important;

        min-width: 145px !important;
        max-width: 145px !important;

        min-height: 82px !important;
        max-height: 82px !important;
    }

}

</style>
</head>


<body>


<!-- ═══════════════════════════════════════
     🎀 플레이어
═══════════════════════════════════════ -->

<div class="player">


    <!-- 🎵 상단 -->

    <div class="top">

        <div class="cover">
            🎵
        </div>


        <div class="info">

            <div
                class="title"
                id="title">
                오늘의 노래
            </div>

            <div
                class="artist"
                id="artist">
                YouTube Music
            </div>

        </div>


        <!-- 커스텀 재생 버튼 -->

        <button
            class="play-button"
            id="playBtn"
            type="button"
            aria-label="재생">
            ▶
        </button>

    </div>


    <!-- ═══════════════════════════════════════
         🎬 실제 YouTube
    ═══════════════════════════════════════ -->

    <div class="youtube-area">

        <div id="youtube"></div>

    </div>


    <!-- ═══════════════════════════════════════
         🎧 진행바
    ═══════════════════════════════════════ -->

    <div class="progress-area">

        <span
            class="time"
            id="current">
            0:00
        </span>


        <input
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1">


        <span
            class="time"
            id="duration">
            0:00
        </span>

    </div>


    <!-- ═══════════════════════════════════════
         🔗 링크
    ═══════════════════════════════════════ -->

    <div class="urlbox">

        <input
            id="url"
            type="text"
            placeholder="YouTube 링크를 붙여넣어 주세요">


        <button
            class="load-button"
            id="load"
            type="button">
            불러오기
        </button>

    </div>


    <div class="note">
        ♡ YouTube 링크를 불러와 음악을 재생해 주세요 ♡
    </div>


</div>


<!-- YouTube IFrame API -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* ═══════════════════════════════════════
   🎵 변수
═══════════════════════════════════════ */

let player = null;

let playerReady = false;

let progressTimer = null;


/* ═══════════════════════════════════════
   🔎 요소
═══════════════════════════════════════ */

const titleElement =
    document.getElementById('title');

const artistElement =
    document.getElementById('artist');

const playButton =
    document.getElementById('playBtn');

const progress =
    document.getElementById('progress');

const currentElement =
    document.getElementById('current');

const durationElement =
    document.getElementById('duration');

const urlInput =
    document.getElementById('url');

const loadButton =
    document.getElementById('load');


/* ═══════════════════════════════════════
   ⏱ 시간 표시
═══════════════════════════════════════ */

function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds || 0)
        );


    const minutes =
        Math.floor(seconds / 60);


    const remaining =
        String(seconds % 60)
        .padStart(2, '0');


    return minutes + ':' + remaining;

}


/* ═══════════════════════════════════════
   🔎 YouTube ID
═══════════════════════════════════════ */

function getVideoId(url) {

    try {

        const parsed =
            new URL(url);


        /* youtu.be */

        if (
            parsed.hostname.includes(
                'youtu.be'
            )
        ) {

            return parsed.pathname
                .replace('/', '')
                .split('?')[0];

        }


        /* youtube.com/watch?v= */

        const v =
            parsed.searchParams.get('v');


        if (v) {

            return v;

        }


        /* youtube.com/shorts/ */

        /* youtube.com/embed/ */

        const match =
            parsed.pathname.match(
                /\/(?:shorts|embed)\/([^/?]+)/
            );


        if (match) {

            return match[1];

        }

    }

    catch (error) {

        return null;

    }


    return null;

}


/* ═══════════════════════════════════════
   🎬 YouTube API
═══════════════════════════════════════ */

function onYouTubeIframeAPIReady() {

    player =
        new YT.Player(
            'youtube',
            {

                width: '160',

                height: '90',

                videoId: '',

                playerVars: {

                    controls: 1,

                    rel: 0,

                    playsinline: 1

                },


                events: {

                    onReady:
                    function () {

                        playerReady = true;

                    },


                    onStateChange:
                    function (event) {

                        updatePlayerState(
                            event.data
                        );

                    }

                }

            }
        );

}


/* ═══════════════════════════════════════
   ▶ 재생 상태
═══════════════════════════════════════ */

function updatePlayerState(state) {

    if (
        state ===
        YT.PlayerState.PLAYING
    ) {

        playButton.textContent = 'Ⅱ';

        startProgress();

        updateInfo();

    }

    else {

        playButton.textContent = '▶';

        stopProgress();

    }

}


/* ═══════════════════════════════════════
   🎵 제목 / 채널
═══════════════════════════════════════ */

function updateInfo() {

    if (
        !player ||
        !playerReady
    ) {

        return;

    }


    const data =
        player.getVideoData
            ? player.getVideoData()
            : null;


    if (!data) {

        return;

    }


    if (data.title) {

        titleElement.textContent =
            data.title;

    }


    if (data.author) {

        artistElement.textContent =
            data.author;

    }

}


/* ═══════════════════════════════════════
   📊 진행바 업데이트
═══════════════════════════════════════ */

function updateProgress() {

    if (
        !player ||
        !playerReady
    ) {

        return;

    }


    const duration =
        player.getDuration() || 0;


    const current =
        player.getCurrentTime() || 0;


    currentElement.textContent =
        formatTime(current);


    durationElement.textContent =
        formatTime(duration);


    if (duration > 0) {

        progress.max =
            duration;

        progress.value =
            current;

    }

}


/* ═══════════════════════════════════════
   ⏱ 진행바 시작
═══════════════════════════════════════ */

function startProgress() {

    stopProgress();

    updateProgress();

    progressTimer =
        setInterval(
            updateProgress,
            300
        );

}


/* ═══════════════════════════════════════
   ⏸ 진행바 정지
═══════════════════════════════════════ */

function stopProgress() {

    if (progressTimer) {

        clearInterval(
            progressTimer
        );

        progressTimer = null;

    }

}


/* ═══════════════════════════════════════
   ▶ 커스텀 재생 버튼
═══════════════════════════════════════ */

playButton.addEventListener(
    'click',
    function () {

        if (
            !player ||
            !playerReady
        ) {

            return;

        }


        const state =
            player.getPlayerState();


        if (
            state ===
            YT.PlayerState.PLAYING
        ) {

            player.pauseVideo();

        }

        else {

            player.playVideo();

        }

    }
);


/* ═══════════════════════════════════════
   🎧 진행바 이동
═══════════════════════════════════════ */

progress.addEventListener(
    'input',
    function () {

        if (
            !player ||
            !playerReady
        ) {

            return;

        }


        player.seekTo(
            Number(this.value),
            true
        );

    }
);


/* ═══════════════════════════════════════
   🔗 링크 불러오기
═══════════════════════════════════════ */

loadButton.addEventListener(
    'click',
    function () {

        const id =
            getVideoId(
                urlInput.value.trim()
            );


        if (!id) {

            alert(
                'YouTube 링크를 확인해 주세요.'
            );

            return;

        }


        if (
            !player ||
            !playerReady
        ) {

            alert(
                'YouTube 플레이어가 아직 준비되지 않았어요. 잠시 후 다시 눌러주세요.'
            );

            return;

        }


        player.loadVideoById(id);


        titleElement.textContent =
            '불러오는 중...';

        artistElement.textContent =
            'YouTube Music';

        currentElement.textContent =
            '0:00';

        durationElement.textContent =
            '0:00';

        progress.value = 0;

    }
);


/* ═══════════════════════════════════════
   ⌨️ 엔터
═══════════════════════════════════════ */

urlInput.addEventListener(
    'keydown',
    function (event) {

        if (
            event.key === 'Enter'
        ) {

            loadButton.click();

        }

    }
);

</script>

</body>
</html>
