<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY LITTLE DIARY MUSIC PLAYER</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #fffaf7 !important;
  background-color: #fffaf7 !important;
}

body {
  padding: 16px;
  font-family: 'Jua', 'Apple SD Gothic Neo', sans-serif;
  color: #4f6652;
}


/* 🎀 메인 플레이어 */
.player {
  width: 100%;
  max-width: 620px;
  margin: auto;

  background: #fffaf7;

  border: 2px solid #e5f2df;
  border-radius: 28px;

  padding: 14px 16px;

  box-shadow:
    0 8px 24px rgba(180,150,140,.10);
}


/* 🎵 위쪽 */
.row {
  display: flex;
  align-items: center;
  gap: 12px;
}


/* 🎵 앨범 이미지 */
.cover {
  width: 56px;
  height: 56px;
  flex: 0 0 56px;

  border-radius: 18px;

  background: #e5f2df;

  display: grid;
  place-items: center;

  font-size: 25px;

  overflow: hidden;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}


/* 📝 제목 */
.info {
  min-width: 0;
  flex: 1;
}

.title {
  font-size: 16px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist {
  font-size: 12px;
  color: #91a292;

  margin-top: 3px;
}


/* ▶ 재생 버튼 */
button {
  border: 0;
  cursor: pointer;

  background: #e5f2df;
  color: #4f6652;

  width: 42px;
  height: 42px;

  border-radius: 50%;

  font-size: 17px;

  font-family: inherit;

  -webkit-tap-highlight-color: transparent;
}

button:active {
  transform: scale(.94);
}


/* ⏱ 진행바 */
.controls {
  display: flex;
  align-items: center;

  gap: 10px;

  margin-top: 10px;
}

.time {
  font-size: 11px;

  color: #91a292;

  min-width: 34px;

  text-align: center;
}

input[type="range"] {
  flex: 1;

  accent-color: #91ad91;

  cursor: pointer;
}


/* 🔗 링크 입력 */
.urlbox {
  display: flex;

  gap: 7px;

  margin-top: 11px;
}

.urlbox input {
  min-width: 0;

  flex: 1;

  border: 1px solid #dfe9da;

  border-radius: 14px;

  padding: 9px 11px;

  font-family: inherit;

  color: #4f6652;

  background: #fff;
}

.urlbox input:focus {
  outline: none;

  border-color: #b8cdb2;
}

.urlbox button {
  width: auto;

  height: 36px;

  border-radius: 12px;

  padding: 0 12px;

  font-size: 13px;
}


/* 🌷 안내 문구 */
.note {
  font-size: 10px;

  color: #a0aaa0;

  text-align: center;

  margin-top: 8px;
}


/*
🎵 YouTube 실제 플레이어

화면 밖으로 완전히 보내지 않고
페이지 안에 존재하도록 함.
*/
#yt {
  position: absolute;

  left: -10000px;
  top: 0;

  width: 200px;
  height: 120px;

  opacity: 0.01;

  pointer-events: none;
}
</style>
</head>


<body>


<!-- 🎀 MY LITTLE DIARY MUSIC PLAYER -->

<div class="player">

  <div class="row">

    <!-- 🎵 앨범 영역 -->
    <div class="cover" id="cover">

      <span id="coverEmoji">🎵</span>

      <img id="coverImg" alt="">

    </div>


    <!-- 📝 제목 / 채널 -->
    <div class="info">

      <div
        class="title"
        id="title"
      >
        오늘의 노래
      </div>

      <div
        class="artist"
        id="artist"
      >
        YouTube Music
      </div>

    </div>


    <!-- ▶ 재생 -->
    <button
      id="playBtn"
      aria-label="재생"
      type="button"
    >
      ▶
    </button>

  </div>


  <!-- ⏱ 진행바 -->

  <div class="controls">

    <span
      class="time"
      id="current"
    >
      0:00
    </span>


    <input
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0"
      step="0.1"
    >


    <span
      class="time"
      id="duration"
    >
      0:00
    </span>

  </div>


  <!-- 🔗 YouTube 링크 -->

  <div class="urlbox">

    <input
      id="url"
      type="text"
      placeholder="YouTube 링크를 붙여넣어 주세요"
    >

    <button
      id="load"
      type="button"
    >
      불러오기
    </button>

  </div>


  <div class="note">
    링크를 불러오면 실제 YouTube 재생과 진행바가 연동됩니다.
  </div>

</div>



<!--
🎵 YouTube IFrame API가 사용할 실제 플레이어
-->
<div id="yt"></div>



<script>

/* =========================================================
   🎵 기본 설정
========================================================= */

let player = null;

let ready = false;

let timer = null;

let pendingVideoId = null;



/* ID로 HTML 요소 찾기 */

const $ = function(id) {

  return document.getElementById(id);

};



/* =========================================================
   ⏱ 시간 표시
========================================================= */

function fmt(seconds) {

  seconds = Math.max(
    0,
    Math.floor(seconds || 0)
  );


  const minutes =
    Math.floor(seconds / 60);


  const secs =
    String(seconds % 60)
      .padStart(2, '0');


  return minutes + ':' + secs;

}



/* =========================================================
   🎬 YouTube 영상 ID 추출
========================================================= */

function videoId(url) {

  try {

    const u =
      new URL(url);


    /* youtu.be/VIDEO_ID */

    if (
      u.hostname.includes('youtu.be')
    ) {

      return u.pathname
        .replace('/', '')
        .split('?')[0];

    }


    /* youtube.com/watch?v=VIDEO_ID */

    const v =
      u.searchParams.get('v');


    if (v) {

      return v;

    }


    /* youtube.com/embed/VIDEO_ID */

    /* youtube.com/shorts/VIDEO_ID */

    const match =
      u.pathname.match(
        /\/(?:embed|shorts)\/([^/?]+)/
      );


    if (match) {

      return match[1];

    }


    return '';

  }

  catch (error) {

    return '';

  }

}



/* =========================================================
   🎵 YouTube API 준비 완료
========================================================= */

window.onYouTubeIframeAPIReady =
function() {


  player =
    new YT.Player(
      'yt',
      {

        height: '120',

        width: '200',

        videoId: '',


        playerVars: {

          /*
          자동재생은 사용하지 않음.
          사용자가 ▶ 버튼을 눌러 재생.
          */

          autoplay: 0,

          controls: 0,

          rel: 0,

          playsinline: 1,

          modestbranding: 1

        },


        events: {

          /* -----------------------------------------
             YouTube 플레이어 준비 완료
          ----------------------------------------- */

          onReady: function(event) {

            ready = true;


            /*
            Notion 안에서 iframe이 중첩되어도
            YouTube iframe에 재생 권한을 명시
            */

            try {

              const iframe =
                event.target.getIframe();


              iframe.setAttribute(
                'allow',
                'autoplay; encrypted-media; picture-in-picture'
              );


              iframe.setAttribute(
                'allowfullscreen',
                ''
              );

            }

            catch (error) {

              console.log(
                'iframe 설정 오류',
                error
              );

            }


            /*
            API가 준비되기 전에
            사용자가 영상을 불러왔다면
            여기서 다시 로드
            */

            if (pendingVideoId) {

              loadVideo(
                pendingVideoId
              );

              pendingVideoId = null;

            }

          },


          /* -----------------------------------------
             재생 상태 변경
          ----------------------------------------- */

          onStateChange:
          function(event) {


            /* ▶ 재생 중 */

            if (
              event.data ===
              YT.PlayerState.PLAYING
            ) {


              updateInfo();


              $('playBtn')
                .textContent = 'Ⅱ';


              clearInterval(timer);


              timer =
                setInterval(
                  updateProgress,
                  300
                );

            }


            /* ⏸ 일시정지 */

            else if (
              event.data ===
              YT.PlayerState.PAUSED
            ) {


              $('playBtn')
                .textContent = '▶';


              clearInterval(timer);

            }


            /* ⏹ 종료 */

            else if (
              event.data ===
              YT.PlayerState.ENDED
            ) {


              $('playBtn')
                .textContent = '▶';


              clearInterval(timer);


              updateProgress();

            }

          }

        }

      }

    );

};



/* =========================================================
   🎵 영상 불러오기
========================================================= */

function loadVideo(id) {


  if (!id) {

    return;

  }


  /*
  YouTube API가 아직 준비되지 않았으면
  ID를 기억해뒀다가 준비 후 불러옴
  */

  if (
    !ready ||
    !player
  ) {

    pendingVideoId = id;

    return;

  }


  try {

    player.loadVideoById(id);

    $('playBtn')
      .textContent = '▶';


    /*
    제목 정보는 영상 로딩 후
    약간 늦게 들어올 수 있음.
    */

    setTimeout(
      updateInfo,
      700
    );


    setTimeout(
      updateInfo,
      1500
    );


  }

  catch (error) {

    console.log(
      '영상 로드 오류:',
      error
    );

  }

}



/* =========================================================
   📝 YouTube 제목 / 채널 가져오기
========================================================= */

function updateInfo() {


  if (
    !player ||
    !ready
  ) {

    return;

  }


  try {

    const info =
      player.getVideoData();


    if (!info) {

      return;

    }


    if (info.title) {

      $('title')
        .textContent =
        info.title;

    }


    if (info.author) {

      $('artist')
        .textContent =
        info.author;

    }

  }

  catch (error) {

    console.log(
      '정보 가져오기 오류:',
      error
    );

  }

}



/* =========================================================
   ⏱ 진행바 업데이트
========================================================= */

function updateProgress() {


  if (
    !player ||
    !ready
  ) {

    return;

  }


  try {

    const duration =
      player.getDuration() || 0;


    const current =
      player.getCurrentTime() || 0;


    $('current')
      .textContent =
      fmt(current);


    $('duration')
      .textContent =
      fmt(duration);


    if (duration > 0) {

      $('progress')
        .max =
        duration;


      $('progress')
        .value =
        current;

    }

  }

  catch (error) {

    /* 무시 */

  }

}



/* =========================================================
   🔗 불러오기 버튼
========================================================= */

$('load')
  .addEventListener(
    'click',
    function() {


      const url =
        $('url')
          .value
          .trim();


      const id =
        videoId(url);


      if (!id) {

        alert(
          'YouTube 링크를 확인해 주세요.'
        );

        return;

      }


      loadVideo(id);

    }

  );



/* =========================================================
   ⌨️ 엔터키
========================================================= */

$('url')
  .addEventListener(
    'keydown',
    function(event) {


      if (
        event.key === 'Enter'
      ) {

        $('load').click();

      }

    }

  );



/* =========================================================
   ▶ 재생 / ⏸ 일시정지
========================================================= */

$('playBtn')
  .addEventListener(
    'click',
    function() {


      /*
      YouTube API가 아직 준비되지 않았으면
      아무 동작도 하지 않음.
      */

      if (
        !player ||
        !ready
      ) {

        return;

      }


      try {


        const state =
          player.getPlayerState();


        /* 현재 재생 중 */

        if (
          state ===
          YT.PlayerState.PLAYING
        ) {

          player.pauseVideo();

        }


        /* 정지 / 일시정지 상태 */

        else {

          player.playVideo();

        }


      }

      catch (error) {

        console.log(
          '재생 오류:',
          error
        );

      }

    }

  );



/* =========================================================
   📍 진행바 이동
========================================================= */

$('progress')
  .addEventListener(
    'input',
    function() {


      if (
        !player ||
        !ready
      ) {

        return;

      }


      try {

        player.seekTo(
          Number(
            $('progress').value
          ),
          true
        );

      }

      catch (error) {

        console.log(
          'seek 오류:',
          error
        );

      }

    }

  );

</script>



<!-- 🎵 YouTube IFrame API -->

<script
  src="https://www.youtube.com/iframe_api">
</script>


</body>
</html>
