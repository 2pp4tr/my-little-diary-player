<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY LITTLE DIARY MUSIC PLAYER</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #fffaf7 !important;
}

body {
    padding: 12px;
    font-family:
        'Apple SD Gothic Neo',
        'Malgun Gothic',
        sans-serif;
    color: #4f6652;
}


/* ─────────────────────
   🎀 PLAYER
───────────────────── */

.player {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;

    padding: 14px 15px;

    background: #fffaf7;

    border: 2px solid #e5f2df;
    border-radius: 27px;

    box-shadow:
        0 8px 24px rgba(180, 150, 140, 0.10);
}


/* ─────────────────────
   🎵 TOP
───────────────────── */

.top {
    display: flex;
    align-items: center;
    gap: 11px;

    margin-bottom: 7px;
}


/* 앨범 아이콘 */

.cover {
    width: 48px;
    height: 48px;

    flex: 0 0 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #e5f2df;

    border-radius: 17px;

    font-size: 21px;
}


/* 제목 */

.info {
    min-width: 0;
    flex: 1;
}

.title {
    color: #4f6652;

    font-size: 15px;
    font-weight: 500;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.artist {
    margin-top: 2px;

    color: #91a292;

    font-size: 10px;
}


/* 재생 버튼 */

.play-button {
    width: 40px;
    height: 40px;

    flex: 0 0 40px;

    border: 0;
    border-radius: 50%;

    background: #e5f2df;
    color: #4f6652;

    font-size: 16px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

.play-button:hover {
    background: #dcebd6;
    transform: scale(1.05);
}

.play-button:active {
    transform: scale(0.95);
}


/* ─────────────────────
   👻 YOUTUBE
───────────────────── */

/*
  iframe은 실제 재생을 위해 유지한다.
  화면에서는 2×2px로만 존재한다.
*/

.youtube-area {
    position: relative;

    width: 2px;
    height: 2px;

    margin: 1px auto 0;

    overflow: hidden;

    opacity: 0;

    pointer-events: none;

    line-height: 0;
}

#youtube {
    display: block !important;

    width: 2px !important;
    height: 2px !important;

    min-width: 2px !important;
    max-width: 2px !important;

    min-height: 2px !important;
    max-height: 2px !important;

    border: 0 !important;

    opacity: 0 !important;
}


/* ─────────────────────
   📍 PROGRESS
───────────────────── */

.progress-area {
    display: flex;
    align-items: center;

    gap: 7px;

    margin-top: 4px;
}

.time {
    width: 31px;
    flex: 0 0 31px;

    color: #91a292;

    font-size: 9px;

    text-align: center;
}

#progress {
    flex: 1;

    width: 100%;
    height: 5px;

    margin: 0;

    appearance: none;
    -webkit-appearance: none;

    background: #dfe9da;

    border-radius: 10px;

    outline: none;

    cursor: pointer;
}

#progress::-webkit-slider-runnable-track {
    height: 5px;

    background: #dfe9da;

    border-radius: 10px;
}

#progress::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 11px;
    height: 11px;

    margin-top: -3px;

    border: 0;

    border-radius: 50%;

    background: #91ad91;

    cursor: pointer;
}

#progress::-moz-range-track {
    height: 5px;

    background: #dfe9da;

    border-radius: 10px;
}

#progress::-moz-range-thumb {
    width: 11px;
    height: 11px;

    border: 0;

    border-radius: 50%;

    background: #91ad91;

    cursor: pointer;
}


/* ─────────────────────
   🔗 URL
───────────────────── */

.urlbox {
    display: flex;

    gap: 7px;

    margin-top: 9px;
}

.urlbox input {
    min-width: 0;

    flex: 1;

    height: 34px;

    padding: 0 11px;

    border: 1px solid #dfe9da;

    border-radius: 13px;

    outline: none;

    background: #fff;

    color: #4f6652;

    font-family: inherit;

    font-size: 10px;
}

.urlbox input::placeholder {
    color: #aab3aa;
}

.urlbox input:focus {
    border-color: #b8cdb2;
}

.load-button {
    height: 34px;

    padding: 0 12px;

    border: 0;

    border-radius: 12px;

    background: #e5f2df;

    color: #4f6652;

    font-family: inherit;

    font-size: 11px;

    cursor: pointer;

    white-space: nowrap;
}

.load-button:hover {
    background: #dcebd6;
}


/* 안내문 */

.note {
    margin-top: 7px;

    color: #a0aaa0;

    font-size: 9px;

    text-align: center;
}


/* ─────────────────────
   📱 MOBILE
───────────────────── */

@media (max-width: 450px) {

    body {
        padding: 8px;
    }

    .player {
        padding: 11px;
    }
}
</style>
</head>


<body>

<div class="player">

    <div class="top">

        <div class="cover">
            🎵
        </div>


        <div class="info">

            <div
                class="title"
                id="title"
            >
                오늘의 노래
            </div>

            <div
                class="artist"
                id="artist"
            >
                YouTube Music
            </div>

        </div>


        <button
            class="play-button"
            id="playBtn"
            type="button"
            aria-label="재생"
        >
            ▶
        </button>

    </div>


    <!-- 👻 숨겨진 YouTube -->

    <div class="youtube-area">
        <div id="youtube"></div>
    </div>


    <!-- 📍 진행바 -->

    <div class="progress-area">

        <span
            class="time"
            id="current"
        >
            0:00
        </span>


        <input
            id="progress"
            type="range"
            min="0"
            max="0"
            value="0"
            step="0.1"
        >


        <span
            class="time"
            id="duration"
        >
            0:00
        </span>

    </div>


    <!-- 🔗 링크 -->

    <div class="urlbox">

        <input
            id="url"
            type="text"
            placeholder="YouTube 링크를 붙여넣어 주세요"
        >


        <button
            class="load-button"
            id="load"
            type="button"
        >
            불러오기
        </button>

    </div>


    <div class="note">
        ♡ YouTube 링크를 불러와 음악을 재생해 주세요 ♡
    </div>

</div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>

let player = null;
let playerReady = false;
let progressTimer = null;


/* 현재 영상 */

let currentVideoId = null;


/* 첫 재생 시도 여부 */

let firstPlayAttempt = false;


/* 요소 */

const titleElement =
    document.getElementById('title');

const artistElement =
    document.getElementById('artist');

const playButton =
    document.getElementById('playBtn');

const progress =
    document.getElementById('progress');

const currentElement =
    document.getElementById('current');

const durationElement =
    document.getElementById('duration');

const urlInput =
    document.getElementById('url');

const loadButton =
    document.getElementById('load');



/* ─────────────────────
   ⏱ 시간
───────────────────── */

function formatTime(seconds) {

    seconds = Math.max(
        0,
        Math.floor(seconds || 0)
    );

    const minutes =
        Math.floor(seconds / 60);

    const remaining =
        String(seconds % 60)
        .padStart(2, '0');

    return minutes + ':' + remaining;
}



/* ─────────────────────
   🔗 YouTube ID
───────────────────── */

function getVideoId(url) {

    try {

        const parsed =
            new URL(url);


        if (
            parsed.hostname.includes('youtu.be')
        ) {

            return parsed.pathname
                .replace('/', '')
                .split('?')[0];

        }


        const v =
            parsed.searchParams.get('v');

        if (v) {

            return v;

        }


        const match =
            parsed.pathname.match(
                /\/(?:shorts|embed)\/([^/?]+)/
            );


        if (match) {

            return match[1];

        }

    }

    catch (error) {

    }


    return null;
}



/* ─────────────────────
   ▶ YouTube API
───────────────────── */

function onYouTubeIframeAPIReady() {

    player =
        new YT.Player(
            'youtube',
            {

                width: '2',

                height: '2',

                videoId: '',


                playerVars: {

                    controls: 0,

                    rel: 0,

                    playsinline: 1,

                    modestbranding: 1

                },


                events: {

                    onReady:
                        function () {

                            playerReady = true;

                        },


                    onStateChange:
                        function (event) {

                            handleState(
                                event.data
                            );

                        }

                }

            }
        );
}



/* ─────────────────────
   🎵 상태
───────────────────── */

function handleState(state) {

    if (
        state ===
        YT.PlayerState.PLAYING
    ) {

        playButton.textContent = 'Ⅱ';

        startProgress();

        updateInfo();

    }

    else if (
        state ===
        YT.PlayerState.PAUSED
    ) {

        playButton.textContent = '▶';

        updateProgress();

        stopProgress();

    }

    else if (
        state ===
        YT.PlayerState.ENDED
    ) {

        playButton.textContent = '▶';

        updateProgress();

        stopProgress();

    }

    else {

        playButton.textContent = '▶';

    }

}



/* ─────────────────────
   🎵 정보
───────────────────── */

function updateInfo() {

    if (
        !player ||
        !playerReady
    ) {

        return;

    }


    const data =
        player.getVideoData
            ? player.getVideoData()
            : null;


    if (!data) {

        return;

    }


    if (data.title) {

        titleElement.textContent =
            data.title;

    }


    if (data.author) {

        artistElement.textContent =
            data.author;

    }

}



/* ─────────────────────
   📍 진행바
───────────────────── */

function updateProgress() {

    if (
        !player ||
        !playerReady
    ) {

        return;

    }


    const duration =
        player.getDuration() || 0;


    const current =
        player.getCurrentTime() || 0;


    currentElement.textContent =
        formatTime(current);


    durationElement.textContent =
        formatTime(duration);


    if (duration > 0) {

        progress.max =
            duration;

        progress.value =
            Math.min(
                current,
                duration
            );

    }

}



/* ─────────────────────
   🔄 진행바 시작
───────────────────── */

function startProgress() {

    stopProgress();

    updateProgress();


    progressTimer =
        setInterval(
            updateProgress,
            250
        );

}



function stopProgress() {

    if (progressTimer) {

        clearInterval(
            progressTimer
        );

        progressTimer = null;

    }

}



/* ─────────────────────
   ▶ 첫 재생
───────────────────── */

function startPlayback() {

    if (
        !player ||
        !playerReady
    ) {

        return;

    }


    /*
      영상이 아직 로드되지 않았다면
      아무것도 하지 않는다.
    */

    if (!currentVideoId) {

        return;

    }


    /*
      첫 번째 커스텀 버튼 클릭.

      먼저 영상이 준비되어 있는지 확인한다.
    */

    const state =
        player.getPlayerState();


    /*
      이미 재생 중이면 일시정지.
    */

    if (
        state ===
        YT.PlayerState.PLAYING
    ) {

        player.pauseVideo();

        return;

    }


    /*
      일시정지 상태라면 이어서 재생.
    */

    if (
        state ===
        YT.PlayerState.PAUSED
    ) {

        player.playVideo();

        return;

    }


    /*
      아직 재생되지 않은 상태.
      사용자 클릭 직후 playVideo() 실행.
    */

    firstPlayAttempt = true;

    player.playVideo();

}



/* ─────────────────────
   ▶ 버튼
───────────────────── */

playButton.addEventListener(
    'click',
    function () {

        /*
          이 함수는 반드시
          실제 사용자 클릭 안에서
          실행된다.
        */

        startPlayback();

    }
);



/* ─────────────────────
   ⏩ 진행바
───────────────────── */

progress.addEventListener(
    'input',
    function () {

        if (
            !player ||
            !playerReady
        ) {

            return;

        }


        const time =
            Number(this.value);


        player.seekTo(
            time,
            true
        );


        currentElement.textContent =
            formatTime(time);

    }
);



/* ─────────────────────
   🔗 불러오기
───────────────────── */

loadButton.addEventListener(
    'click',
    function () {

        loadVideo();

    }
);



urlInput.addEventListener(
    'keydown',
    function (event) {

        if (
            event.key === 'Enter'
        ) {

            loadVideo();

        }

    }
);



/* ─────────────────────
   🎵 영상 불러오기
───────────────────── */

function loadVideo() {

    const id =
        getVideoId(
            urlInput.value.trim()
        );


    if (!id) {

        alert(
            'YouTube 링크를 확인해 주세요.'
        );

        return;

    }


    if (
        !player ||
        !playerReady
    ) {

        alert(
            'YouTube 플레이어가 아직 준비되지 않았어요. 잠시 후 다시 눌러주세요.'
        );

        return;

    }


    currentVideoId = id;


    /*
      cueVideoById를 사용해서
      링크를 불러올 때 자동재생하지 않는다.
    */

    player.cueVideoById(id);


    titleElement.textContent =
        '불러오는 중...';


    artistElement.textContent =
        'YouTube Music';


    currentElement.textContent =
        '0:00';


    durationElement.textContent =
        '0:00';


    progress.value =
        0;


    progress.max =
        0;


    waitForVideoData();

}



/* ─────────────────────
   🎵 영상 정보 기다리기
───────────────────── */

function waitForVideoData() {

    let count = 0;


    const timer =
        setInterval(
            function () {

                count++;


                if (
                    player &&
                    playerReady
                ) {

                    const data =
                        player.getVideoData();


                    const duration =
                        player.getDuration();


                    if (
                        data &&
                        data.title
                    ) {

                        titleElement.textContent =
                            data.title;

                    }


                    if (
                        data &&
                        data.author
                    ) {

                        artistElement.textContent =
                            data.author;

                    }


                    if (
                        duration > 0
                    ) {

                        durationElement.textContent =
                            formatTime(
                                duration
                            );


                        progress.max =
                            duration;


                        clearInterval(
                            timer
                        );


                        return;

                    }

                }


                if (
                    count > 40
                ) {

                    clearInterval(
                        timer
                    );

                }

            },
            250
        );

}



/* ─────────────────────
   🧹 종료
───────────────────── */

window.addEventListener(
    'beforeunload',
    function () {

        stopProgress();

    }
);

</script>

</body>
</html>
