<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MY LITTLE DIARY MUSIC PLAYER</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #fffaf7 !important;
}

body {
  padding: 16px;
  font-family:
    'Apple SD Gothic Neo',
    sans-serif;
  color: #4f6652;
}

.player {
  width: 100%;
  max-width: 620px;
  margin: auto;

  background: #fffaf7;

  border: 2px solid #e5f2df;
  border-radius: 28px;

  padding: 14px 16px;

  box-shadow:
    0 8px 24px rgba(180,150,140,.10);
}


/* 🎵 제목 */
.title {
  display: flex;
  align-items: center;
  gap: 10px;

  font-size: 15px;
  margin-bottom: 10px;

  color: #4f6652;
}

.music {
  width: 38px;
  height: 38px;

  border-radius: 14px;

  background: #e5f2df;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 19px;
}


/* 🎀 YouTube */
.video {
  width: 100%;
  aspect-ratio: 16 / 9;

  border-radius: 20px;

  overflow: hidden;

  background: #e5f2df;
}

.video iframe {
  width: 100%;
  height: 100%;

  border: 0;

  display: block;
}


/* 💚 아래 문구 */
.note {
  margin-top: 9px;

  text-align: center;

  font-size: 10px;

  color: #a0aaa0;
}
</style>
</head>

<body>

<div class="player">

  <div class="title">
    <div class="music">🎵</div>

    <div>
      ♡ 오늘의 플레이리스트 ♡
    </div>
  </div>


  <div class="video">

    <iframe
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      title="YouTube Music Player"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share
      "
      allowfullscreen>
    </iframe>

  </div>


  <div class="note">
    ♡ 오늘도 좋은 노래와 함께 ♡
  </div>

</div>

</body>
</html>
