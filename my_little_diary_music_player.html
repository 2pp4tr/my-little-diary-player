<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY LITTLE DIARY MUSIC PLAYER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
*{box-sizing:border-box}
body{
  margin:0; padding:16px;
  background:transparent;
  font-family:'Jua','Apple SD Gothic Neo',sans-serif;
  color:#4f6652;
}
.player{
  width:100%; max-width:620px; margin:auto;
  background:#fffaf7;
  border:2px solid #e5f2df;
  border-radius:28px;
  padding:14px 16px;
  box-shadow:0 8px 24px rgba(180,150,140,.10);
}
.row{display:flex;align-items:center;gap:12px}
.cover{
  width:56px;height:56px;flex:0 0 56px;
  border-radius:18px;
  background:#e5f2df;
  display:grid;place-items:center;font-size:25px;
  overflow:hidden;
}
.cover img{width:100%;height:100%;object-fit:cover;display:none}
.info{min-width:0;flex:1}
.title{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:12px;color:#91a292;margin-top:3px}
button{
  border:0; cursor:pointer;
  background:#e5f2df;color:#4f6652;
  width:42px;height:42px;border-radius:50%;
  font-size:17px;
}
.controls{display:flex;align-items:center;gap:10px;margin-top:10px}
.time{font-size:11px;color:#91a292;min-width:34px;text-align:center}
input[type=range]{flex:1;accent-color:#91ad91;cursor:pointer}
.urlbox{display:flex;gap:7px;margin-top:11px}
.urlbox input{
  min-width:0;flex:1;border:1px solid #dfe9da;
  border-radius:14px;padding:9px 11px;
  font-family:inherit;color:#4f6652;background:#fff;
}
.urlbox button{width:auto;height:36px;border-radius:12px;padding:0 12px;font-size:13px}
.note{font-size:10px;color:#a0aaa0;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="player">
  <div class="row">
    <div class="cover" id="cover"><span>🎵</span><img id="coverImg"></div>
    <div class="info">
      <div class="title" id="title">오늘의 노래</div>
      <div class="artist" id="artist">YouTube Music</div>
    </div>
    <button id="playBtn" aria-label="재생">▶</button>
  </div>
  <div class="controls">
    <span class="time" id="current">0:00</span>
    <input id="progress" type="range" min="0" max="100" value="0" step="0.1">
    <span class="time" id="duration">0:00</span>
  </div>
  <div class="urlbox">
    <input id="url" placeholder="YouTube 링크를 붙여넣어 주세요">
    <button id="load">불러오기</button>
  </div>
  <div class="note">링크를 불러오면 실제 YouTube 재생과 진행바가 연동됩니다.</div>
</div>
<div id="yt" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, ready=false, timer=null;
const $=id=>document.getElementById(id);
function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function videoId(url){
  try{
    const u=new URL(url);
    if(u.hostname.includes('youtu.be')) return u.pathname.slice(1);
    if(u.searchParams.get('v')) return u.searchParams.get('v');
    const m=u.pathname.match(/\/(?:embed|shorts)\/([^/?]+)/); return m?m[1]:'';
  }catch(e){return ''}
}
function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt',{
    height:'1',width:'1',
    videoId:'',
    playerVars:{playsinline:1,controls:0,rel:0},
    events:{
      onReady:()=>{ready=true},
      onStateChange:e=>{
        if(e.data===YT.PlayerState.PLAYING){
          $('playBtn').textContent='Ⅱ';
          clearInterval(timer);
          timer=setInterval(update,300);
        }else{
          $('playBtn').textContent='▶';
          clearInterval(timer);
        }
      }
    }
  });
}
function update(){
  if(!player||!ready)return;
  const d=player.getDuration()||0,c=player.getCurrentTime()||0;
  $('current').textContent=fmt(c); $('duration').textContent=fmt(d);
  $('progress').max=d||100; $('progress').value=c;
}
$('load').onclick=()=>{
  const id=videoId($('url').value.trim());
  if(!id){alert('YouTube 링크를 확인해 주세요.');return}
  player.loadVideoById(id);
  $('title').textContent='오늘의 노래';
  $('artist').textContent='YouTube Music';
  $('playBtn').textContent='Ⅱ';
};
$('playBtn').onclick=()=>{
  if(!player||!ready)return;
  const s=player.getPlayerState();
  if(s===YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
};
$('progress').oninput=()=>{
  if(player&&ready) player.seekTo(Number($('progress').value),true);
};
</script>
</body>
</html>
